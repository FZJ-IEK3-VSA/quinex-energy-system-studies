[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "quenix_application"
version = "0.0.1"
description = "Application of Quenix on a set of papers"
authors = [
  { name = "Maxime Gorres" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["quenix_application"]
include = ["pyproject.toml", "quenix_application/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["quenix_application"]
force-sort-within-sections = true

